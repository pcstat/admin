# The Worker's name is its address: https://<name>.<your-account-subdomain>.workers.dev
# "wrangler deploy" creates the Worker on the first run, so nothing has to be created by hand.
name = "pcstat-admin"
main = ".open-next/worker.js"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = ".open-next/assets"
binding = "ASSETS"

# Plain (non-secret) configuration.
# The database repo is NOT set here: it lives in database.json at the root of this repo.
# Secrets (GITHUB_TOKEN, ADMIN_PASSWORD_HASH, AUTH_SESSION_SECRET) are NOT set here either: the deploy
# workflow uploads them from GitHub secrets on every deploy (see docs/DEPLOYMENT.md in the website repo).
[vars]
DATA_PROVIDER = "github"
