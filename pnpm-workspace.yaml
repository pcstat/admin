packages:
  - "."

# pnpm only runs install scripts of packages listed here.
allowBuilds:
  esbuild: true
  unrs-resolver: true
  workerd: true

# Brand-new releases of these tools are allowed (pnpm normally waits a few days before installing a release).
minimumReleaseAgeExclude:
  - '@opennextjs/aws@4.1.10'
  - '@opennextjs/cloudflare@1.20.11'
  - miniflare@5.20261012.0-beta
  - wrangler@4.151.0
  - '@next/env@16.4.1'
  - '@next/swc-darwin-arm64@16.4.1'
  - '@next/swc-darwin-x64@16.4.1'
  - '@next/swc-linux-arm64-gnu@16.4.1'
  - '@next/swc-linux-arm64-musl@16.4.1'
  - '@next/swc-linux-x64-gnu@16.4.1'
  - '@next/swc-linux-x64-musl@16.4.1'
  - '@next/swc-win32-arm64-msvc@16.4.1'
  - '@next/swc-win32-x64-msvc@16.4.1'
  - next@16.4.1
  - '@cloudflare/workerd-darwin-64@1.20261012.1'
  - '@cloudflare/workerd-darwin-arm64@1.20261012.1'
  - '@cloudflare/workerd-linux-64@1.20261012.1'
  - '@cloudflare/workerd-linux-arm64@1.20261012.1'
  - '@cloudflare/workerd-windows-64@1.20261012.1'
  - '@types/node@26.6.5'
  - workerd@1.20261012.1
