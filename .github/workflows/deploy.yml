name: Deploy admin panel to Cloudflare

# Builds the panel on GitHub and deploys it as a Cloudflare Worker. The Worker is created automatically
# on the first run, and its secrets are uploaded from GitHub secrets on every run, so everything is set
# up in GitHub only. Setup (tokens, secrets): docs/DEPLOYMENT.md in the website repo.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: deploy-admin
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The pnpm version comes from the "packageManager" field in package.json.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm cf:build
        env:
          NEXT_PUBLIC_WEBSITE_URL: ${{ vars.NEXT_PUBLIC_WEBSITE_URL }}

      # Fail early, with a readable message, when a secret has not been added yet.
      - name: Prepare the Worker's secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DATABASE_REPO_TOKEN: ${{ secrets.DATABASE_REPO_TOKEN }}
          ADMIN_PASSWORD_HASH: ${{ secrets.ADMIN_PASSWORD_HASH }}
          AUTH_SESSION_SECRET: ${{ secrets.AUTH_SESSION_SECRET }}
        run: |
          missing=""
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID DATABASE_REPO_TOKEN ADMIN_PASSWORD_HASH AUTH_SESSION_SECRET; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing GitHub Actions secrets:$missing — see docs/DEPLOYMENT.md in the website repo."
            exit 1
          fi
          umask 077
          jq -n \
            --arg GITHUB_TOKEN "$DATABASE_REPO_TOKEN" \
            --arg ADMIN_PASSWORD_HASH "$ADMIN_PASSWORD_HASH" \
            --arg AUTH_SESSION_SECRET "$AUTH_SESSION_SECRET" \
            '{GITHUB_TOKEN: $GITHUB_TOKEN, ADMIN_PASSWORD_HASH: $ADMIN_PASSWORD_HASH, AUTH_SESSION_SECRET: $AUTH_SESSION_SECRET}' \
            > "$RUNNER_TEMP/worker-secrets.json"

      # Creates the Worker (name in wrangler.toml) when it does not exist yet, uploads the build and
      # sets the three Worker secrets from the file above.
      - name: Deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --secrets-file ${{ runner.temp }}/worker-secrets.json
